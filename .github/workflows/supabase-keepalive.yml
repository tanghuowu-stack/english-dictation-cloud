name: Supabase keepalive

# This repository is public. GitHub may disable scheduled workflows after
# 60 days without repository activity; re-enable this workflow in Actions if needed.
on:
  # GitHub cron uses UTC. 06:17 UTC is 14:17 in Asia/Taipei/Beijing.
  # Scheduled runs occur only on Tuesday and Friday; the Codex monitor handles
  # a single next-day recovery run after a failed, timed-out, or missing run.
  schedule:
    - cron: "17 6 * * 2,5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    name: Run read-only database query
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

    steps:
      - name: Query dedicated keepalive table
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -z "${SUPABASE_URL}" ]]; then
            echo "::error::Missing GitHub Actions secret: SUPABASE_URL"
            exit 1
          fi

          if [[ -z "${SUPABASE_ANON_KEY}" ]]; then
            echo "::error::Missing GitHub Actions secret: SUPABASE_ANON_KEY"
            exit 1
          fi

          if [[ "${SUPABASE_URL}" != https://* ]]; then
            echo "::error::SUPABASE_URL must use HTTPS."
            exit 1
          fi

          response_file="$(mktemp)"
          trap 'rm -f "${response_file}"' EXIT

          set +e
          http_status="$(
            curl \
              --request GET \
              --silent \
              --show-error \
              --connect-timeout 15 \
              --max-time 45 \
              --output "${response_file}" \
              --write-out "%{http_code}" \
              --header "apikey: ${SUPABASE_ANON_KEY}" \
              "${SUPABASE_URL%/}/rest/v1/supabase_keepalive?select=id%2Cmarker&id=eq.1&marker=eq.ok"
          )"
          curl_exit_code=$?
          set -e

          if (( curl_exit_code != 0 )); then
            echo "::error::Supabase keepalive request failed (curl exit ${curl_exit_code})."
            exit "${curl_exit_code}"
          fi

          if [[ "${http_status}" != "200" ]]; then
            echo "::error::Supabase keepalive query returned HTTP ${http_status}."
            exit 1
          fi

          if ! jq -e 'length == 1 and .[0].id == 1 and .[0].marker == "ok"' "${response_file}" > /dev/null; then
            echo "::error::Supabase keepalive query returned unexpected data."
            exit 1
          fi

          response_bytes="$(wc -c < "${response_file}" | tr -d ' ')"
          echo "Supabase keepalive query succeeded (HTTP ${http_status}, ${response_bytes} response bytes)."

      - name: Verify anon permission boundaries
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -Eeuo pipefail

          api_url="${SUPABASE_URL%/}/rest/v1"

          assert_denied() {
            local operation="$1"
            local method="$2"
            local path="$3"
            local body="${4:-}"
            local args=(
              --request "${method}"
              --silent
              --show-error
              --output /dev/null
              --write-out "%{http_code}"
              --header "apikey: ${SUPABASE_ANON_KEY}"
              --header "Content-Type: application/json"
            )

            if [[ -n "${body}" ]]; then
              args+=(--data-raw "${body}")
            fi

            local status
            status="$(curl "${args[@]}" "${api_url}${path}")"
            if [[ ! "${status}" =~ ^(401|403)$ ]]; then
              echo "::error::${operation} was not rejected by permissions (HTTP ${status})."
              exit 1
            fi
            echo "${operation} correctly denied (HTTP ${status})."
          }

          assert_denied "INSERT keepalive row" "POST" "/supabase_keepalive" '{"id":2,"marker":"ok"}'
          assert_denied "UPDATE keepalive row" "PATCH" "/supabase_keepalive?id=eq.1" '{"marker":"ok"}'
          assert_denied "DELETE keepalive row" "DELETE" "/supabase_keepalive?id=eq.999"
          assert_denied "SELECT existing business table" "GET" "/libraries?select=id&limit=1"
